<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12" />
  
  <!-- Dumbbell Icon -->
  <g transform="translate(106, 126) scale(0.6)">
    <!-- Central Bar -->
    <rect x="180" y="230" width="140" height="40" rx="8" fill="#94a3b8" />
    <rect x="210" y="225" width="80" height="50" rx="6" fill="#cbd5e1" />
    
    <!-- Left Weights -->
    <rect x="140" y="160" width="40" height="180" rx="14" fill="url(#accent)" />
    <rect x="90" y="120" width="45" height="260" rx="16" fill="url(#accent)" />
    <rect x="55" y="170" width="30" height="160" rx="12" fill="#1d4ed8" />
    
    <!-- Right Weights -->
    <rect x="320" y="160" width="40" height="180" rx="14" fill="url(#accent)" />
    <rect x="365" y="120" width="45" height="260" rx="16" fill="url(#accent)" />
    <rect x="415" y="170" width="30" height="160" rx="12" fill="#1d4ed8" />
  </g>

  <!-- Flame Badge -->
  <circle cx="380" cy="130" r="45" fill="#1e293b" stroke="#f97316" stroke-width="4"/>
  <path d="M380 100 C385 115, 400 125, 400 140 C400 155, 388 165, 380 165 C372 165, 360 155, 360 140 C360 128, 370 120, 374 110 Z" fill="url(#fire)" />
</svg>
